<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How You Lead | Lead to Leave</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--green:#0A4D2E;--copper:#C17A36;--lcopper:#E3A766;--cream:#F6F3EC;--ink:#22302A;--muted:#6F6A5C;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',Arial,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.qtext,.essence,.name{font-family:'Playfair Display',Georgia,serif;text-wrap:balance;}
p,li,.sub,.note,.lead,.contact,.essence,.dsub{text-wrap:pretty;}
.wrap{max-width:680px;margin:0 auto;padding:0 22px;}
.eyebrow{font-size:12px;letter-spacing:4px;font-weight:700;text-transform:uppercase;}
.btn{display:inline-block;background:var(--copper);color:#fff;border:none;text-decoration:none;font-family:'Montserrat',Arial,sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:14px;padding:16px 34px;border-radius:9px;cursor:pointer;}
.btn:hover{background:#a9662a;}
.chip{background:#fff;border:1px solid #e0d9c8;border-radius:30px;padding:9px 18px;font-size:15px;font-weight:600;color:var(--green);display:inline-block;}
.list{list-style:none;}
.list li{background:#fff;border-radius:10px;padding:14px 16px 14px 42px;margin-bottom:10px;position:relative;font-size:16px;box-shadow:0 3px 10px rgba(0,0,0,.05);}
.list li:before{position:absolute;left:16px;top:14px;font-weight:700;}
.strengths li:before{content:"+";color:#2e7d4f;font-size:18px;top:12px;}
.shadows li:before{content:"!";color:var(--copper);font-size:16px;}
.block{margin-top:34px;}
.block h2{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--copper);font-weight:700;font-family:'Montserrat';margin-bottom:14px;}
.leaders{display:flex;flex-wrap:wrap;gap:10px;}
.training .step{display:flex;gap:14px;margin-bottom:16px;background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 3px 10px rgba(0,0,0,.05);}
.training .step:last-child{margin-bottom:0;}
.training .n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--copper);color:#fff;font-family:'Playfair Display',Georgia,serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px;}
.training .step p{font-size:16px;}

.res-hero{text-align:center;padding:48px 20px 46px;}
.res-ico{width:100px;height:100px;border-radius:50%;margin:0 auto 14px;background-size:cover;background-position:center;box-shadow:0 0 0 3px rgba(255,255,255,.9), 0 8px 20px rgba(0,0,0,.3);}
.leaders.clash .chip{border-color:#C17A36;color:#9a5a1f;}
.workwith{background:#fff;border-radius:10px;padding:18px 20px;font-size:16px;line-height:1.55;color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.05);}
.res-hero h1{font-size:46px;font-weight:800;margin:12px 0 12px;}
.res-hero .essence{font-size:19px;font-style:italic;max-width:580px;margin:0 auto;line-height:1.5;}
.cta{background:var(--green);border-radius:14px;padding:32px 26px;text-align:center;margin:36px 0 0;color:var(--cream);}
.cta h3{color:#fff;font-size:24px;margin-bottom:10px;}
.cta p{color:#e7e2d5;font-size:16px;margin-bottom:20px;max-width:520px;margin-left:auto;margin-right:auto;}
.foot{text-align:center;padding:36px 20px;}
.foot .mark{font-family:'Playfair Display',Georgia,serif;letter-spacing:6px;font-weight:700;color:var(--green);}
.foot .sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--copper);font-weight:700;margin-top:6px;}
@media(max-width:600px){.res-hero h1{font-size:34px;}}

#start{min-height:80vh;display:flex;align-items:center;padding:48px 0;}
#start h1{font-size:40px;color:var(--green);font-weight:800;margin-bottom:14px;}
#start p{font-size:18px;color:var(--ink);margin-bottom:14px;max-width:560px;}
#quiz{padding:26px 0 60px;min-height:100vh;}
.progresswrap{position:sticky;top:0;background:var(--cream);padding:16px 0 12px;z-index:5;}
.progress-track{height:7px;background:#e2dccc;border-radius:5px;overflow:hidden;}
.progress-fill{height:100%;width:0;background:var(--copper);transition:width .25s ease;}
.progress-label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:8px;}
.qcard{margin-top:28px;}
.qnum{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--copper);font-weight:700;}
.qtext{font-size:27px;color:var(--green);font-weight:700;margin:10px 0 26px;line-height:1.25;}
.scale{display:flex;flex-direction:column;gap:10px;}
.scale button{width:100%;text-align:left;background:#fff;border:1.5px solid #e0d9c8;border-radius:10px;padding:15px 18px;font-family:'Montserrat',Arial,sans-serif;font-size:16px;color:var(--ink);cursor:pointer;transition:all .12s ease;}
.scale button:hover{border-color:var(--copper);background:#fffdf8;}
.backrow{margin-top:22px;}
.back{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;font-family:'Montserrat';}
.screen{display:none;}.screen.active{display:block;}
.donebar{background:var(--copper);color:#fff;border-radius:10px;padding:15px 18px;margin:0 0 22px;text-align:center;font-size:15px;line-height:1.4;}
.donebar b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:20px;margin-bottom:3px;}
.savebtn{display:block;margin:12px auto 0;background:#fff;color:var(--green);border:none;border-radius:8px;padding:11px 24px;font-family:'Montserrat',Arial,sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
.savebtn:hover{background:#fdf6ec;}
.savewrap{max-width:680px;margin:30px auto 10px;padding:0 22px;text-align:center;}
.savebtn.alt{background:var(--copper);color:#fff;display:inline-block;padding:14px 30px;}
.savebtn.alt:hover{background:#a9662a;}
@media print{
  #testbar,.donebar,.savewrap,.savebtn,.back,.progresswrap{display:none !important;}
  body{background:#fff !important;padding-top:0 !important;}
  .screen:not(.active){display:none !important;}
  .res-hero,.cta,.leaders .chip,.list li,.training .step{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .block{page-break-inside:avoid;}
}
</style></head><body>

o share it</h2><div class=\"leaders\"><span class=\"chip\">Nelson Mandela</span><span class=\"chip\">Martin Luther King Jr.</span><span class=\"chip\">Mother Teresa</span></div></div>\n    <div class=\"block\"><h2>Works well with</h2><div class=\"leaders\"><span class=\"chip\">Talent Whisperer</span><span class=\"chip\">Gentle Grizzly</span></div></div>\n    <div class=\"block\"><h2>Where you'll clash</h2><div class=\"leaders clash\"><span class=\"chip\">Explosive Cricket</span><span class=\"chip\">Diamond Cutter</span></div></div>\n    <div class=\"block\"><h2>How to work with other leaders</h2><div class=\"workwith\">You try to smooth things over for everyone. With an Explosive Cricket or a Diamond Cutter, let them handle the hard conversation themselves instead of stepping in to take it on.</div></div>\n    <div class=\"block\"><h2>Where you are strong</h2><ul class=\"list strengths\"><li>When your team messes up, you take responsibility in front of others and handle the details privately. People trust you for it.</li><li>You know what is going on in your people's lives, not just their work. You can tell when someone is off.</li><li>You will do the jobs nobody wants so your team does not have to.</li></ul></div>\n    <div class=\"block\"><h2>Where you get in your own way</h2><ul class=\"list shadows\"><li>You take on parts of other people's jobs. When you do, you teach your team that anything hard is yours to handle, so they stop stretching and wait for you. Keep it up and you become the bottleneck for a group that could have run itself.</li><li>You step in and fix problems before your people work through them. The struggle you remove is usually where the learning happens, so they stay dependent on you. Over time you end up with a team that cannot function without you in the room.</li><li>You put yourself last, over and over. It looks like dedication, but it drains the energy and patience your team needs from you. Left unchecked it turns into burnout, and a burned-out leader helps no one.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>Give back one task you have taken on that belongs to someone else. Hand it over directly, tell them you are there if they get stuck, then let them run it their way. Do not step back in unless they ask.</p></div><div class=\"step\"><div class=\"n\">2</div><p>Before you jump in to help, decide whether the person is stuck or just uncomfortable. If it is only discomfort, stay out and check in afterward. Let the situation teach them, and coach after, not during.</p></div><div class=\"step\"><div class=\"n\">3</div><p>Pick one limit and hold it this week, like leaving at a set time or turning down a task that is not yours. Say it to your team so they see it. How you draw the line is up to you, but draw one.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning this into a plan for your team, book a conversation with me. It is free. Bring your result and the one thing you are stuck on.</p>\n      <a class=\"btn\" href=\"https://app.paperbell.com/checkout/bookings/new?package_id=227159\">Book a free conversation</a>\n    </div>\n  </div>\n","espresso":"\n  <div class=\"res-hero\" style=\"background:#C05A2A;\">\n    <div class=\"wrap\">\n      <div class=\"res-ico\" style=\"background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAYAAAA8AXHiAABxwUlEQVR4nO29ebxlV3Ue+K29z7nDG6peTVJVCQmNQEpCDMWMcDHEbcd2HMfOUxLbBAOJcHfs4E48EHecV6/ttg2x07FJTKTEGPCYqnbHUzC200Ax2jHCRiABQhKaSzW/6d57pr1X/7HW2ufcV6+EhCUk3L35iffq3XPPsM/aa33rW8Mm/P9j8yDmr+JLhK/iW399Bz3VN/BUDQbolpsOZpv//pZbbq2/qvMtwd1y/KDv/u1WALd8lef7eh//nxKspaVD2f7jGwQ8igAdQvbvnv0396+vlpz3IgFDDABgCGDS/iwwAQBMCmC4Y4i33fLf79/qdB9aOpTdqdfcce7KeOPRo+EJf7Cn4fhrK1hLS0vu2jvuoAu9yEOHDg2+4yr+7mJUxpwylzvKBt41NfF3zPT83y7rgNx5eCI4AmIMcCCwA0CEECMYDk2MIE+oivqnvMu+XBC7yDHWMWIU6uqnfutTv7bV9Rmgo4uL7vYDR3 in your own way</h2><ul class=\"list shadows\"><li>You avoid the conversations that might cool the mood. The problem you dance around does not go away, it grows, and your people notice you will not name it. Over time they stop trusting you with the hard stuff, and the standard quietly drops.</li><li>The team runs on your energy. That feels good until the day you are tired, distracted, or out, and the whole group sinks with you. A team that only performs when you are up cannot hold itself together.</li><li>You pour energy outward and rarely refill your own. The empty tank shows up first at home and in your patience, then in the work. Ignore it long enough and the thing people love about you burns out.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>Have the one conversation you have been keeping light. Name the issue plainly, stay warm, and say what needs to change. You choose the words, but do not leave without saying the hard part.</p></div><div class=\"step\"><div class=\"n\">2</div><p>Build one thing that holds the energy when you are gone, like a daily standup, a shared win you track, or a teammate who owns the mood. Pick the one that fits your team and put it in place this month.</p></div><div class=\"step\"><div class=\"n\">3</div><p>List what drains you and remove one of those things this month. Protect that time the way you protect the work. How you refill is yours to figure out, but do it before you are empty.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning this into a plan for your team, book a conversation with me. It is free. Bring your result and the one thing you are stuck on.</p>\n      <a class=\"btn\" href=\"https://app.paperbell.com/checkout/bookings/new?package_id=227159\">Book a free conversation</a>\n    </div>\n  </div>\n","juggernaut":"\n  <div class=\"res-hero\" style=\"backgroun leaders\"><span class=\"chip\">Explosive Cricket</span><span class=\"chip\">Diamond Cutter</span></div></div>\n    <div class=\"block\"><h2>Where you'll clash</h2><div class=\"leaders clash\"><span class=\"chip\">Human Espresso</span><span class=\"chip\">Lighthouse Keeper</span></div></div>\n    <div class=\"block\"><h2>How to work with other leaders</h2><div class=\"workwith\">Your calm can look like slowness to people who move fast. With a Lighthouse Keeper or a Human Espresso, tell them when you agree but want to wait, and when you are ready to move now, so they do not read your calm as resistance.</div></div>\n    <div class=\"block\"><h2>Where you are strong</h2><ul class=\"list strengths\"><li>You stay calm in a crisis, and that keeps the team calm.</li><li>People trust you to make good decisions under pressure.</li><li>You handle a lot without showing stress, so the team feels safe when things are uncertain.</li></ul></div>\n    <div class=\"block\"><h2>Where you get in your own way</h2><ul class=\"list shadows\"><li>When you go quiet, people cannot read you, so they fill the silence with worry. Your calm is meant to steady them, but without words it does the opposite. Say nothing long enough and a steady team starts to feel anxious and left in the dark.</li><li>Some moments need speed, and you hold your usual pace. To the team it looks like you do not see the fire, so they either panic or wait on you. Miss enough of those and people stop bringing you the urgent things.</li><li>You hold stress in and let none of it out. It does not disappear, it moves into your sleep, your health, and the people at home. Carry it silently long enough and it shows up as a health problem or a strained relationship, not a work one.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>Once a day, say what you are thinking or watching for out loud. A short 'here is what is on my mind' gives people the read they need. Keep it brief, but do not leave them guessing.</p></div><div class=\"step\"><div class=\"n\">2</div><p>Learn to name urgency. When something needs speed, say so and move faster on purpose so the team can tell it apart from your normal steadiness. You set the threshold, but make the shift visible.</p></div><div class=\"step\"><div class=\"n\">3</div><p>Pick a real outlet for the pressure that is not your family or your body, like exercise, a walk, or a person you talk to each week. Choose what works for you and make it a habit, not a once-in-a-while.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning this into a plan for your team, book a conversation with me. It is free. Bring your result and the one thing you are stuck on.</p>\n      <a class=\"btn\" href=\"https://app.paperbell.com/checkout/bookings/new?package_id=227159\">Book a free conversation</a>\n    </div>\n  </div>\n","velvet":"\n  <div class=\"res-hero\" style=\"background:#6E2F48;\">\n    <div class=\"wrap\">\n      <div class=\"res-ico\" style=\"background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAYAAAA8AXHiAABzKklEQVR4nO39d7RfyXXfiX521Tm/cAMu7kUGOnczgRRFEiLZTAIpBjUlKlDytf3G8pP9xo9jz/J7tsdWsJb9QNgeWZI19rNnxrQ5Y8nysiyRMK0sNSUmKFBMoBhBstnsHBFu/oUTqvb7o6rOOb8LoNlNNpPmHay7cMP5nVC1a+/v/u5Qwv//2H3IV/g5fVqf4lv8+EoH8c/DIW85cSI7B5wA0v9vP3eu+koudopT5tETv227vzsHnPsKr/etfvxfSrBOnjyZPWtnR+DaAnTy5MnsYL54dLPY1J7vC0yA4RNedzgccOY9v/3A1f526uTJ7NF4z/VbbvFnzpxxX91bfGscf24F69SpU+b8+fNyrYm88eSNgxea2/47N669NcYY7zJr8rp2/gcH/d73VXWNxSIoVgzeg8TRUq9ggu1zqmS5oa7cP8PrvbWpjRP1GEutvvzdD579z9d4RFldXTXHz5zR0+C/NqPwjTv+vAmWrB4/nsNzOXP+TJl+ubq6ao8fP6Mf/4OT/7Yv9rCvvcfYY/P9wUukduDBAKIWV9d451QQMWIUBSuCqrajpYpi8KKIgsfT6/VEjODweILg1ShVUf2mWqlsbu3Ilb//W69//79fPX88O3PmfPt8x1d7Fw5c8GfPnq2/3gP2tTr+PAiWAKyurpozZ854Ioj+3le+5sS87edFVf6L3NjnSu1cn3x/bgx4UBW0qko8YoyoVwRQo1gEKyJIHB4hXTWeJICYIGyAiOCd1oh6jKAgql5FjLGZzRRFjVD4Ai96QXKbT6vyPwz  respect you and do not want to let you down.</li><li>You make tough calls without turning them into a fight.</li></ul></div>\n    <div class=\"block\"><h2>Where you get in your own way</h2><ul class=\"list shadows\"><li>You are kind about the standard, so people cannot always tell where your line is until they have crossed it. They are not trying to fail you, they just cannot see the bar. When the line stays invisible, good people miss it and feel blindsided when you finally react.</li><li>You hold the standard yourself, fixing and covering, instead of teaching your people to hold it. It works while you are watching. Step away and the quality drops, because it lived in you and never got built into them.</li><li>You wait too long to act on a problem because you do not want to bruise the relationship. The delay lets the issue grow and lets the person keep going wrong. By the time you address it, the fix is harder and the conversation lands worse than it would have early.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>Say what good looks like before the work starts, and name the line clearly, in your own words, so there is no guessing. Do this at the front of a project, not after it slips.</p></div><div class=\"step\"><div class=\"n\">2</div><p>When you catch yourself fixing something to keep the peace, stop and hand it back with the expectation attached. Explain the standard once, then let them do it, even if the first pass is rough. How you coach it is yours, but do not take it back.</p></div><div class=\"step\"><div class=\"n\">3</div><p>When you are avoiding a hard conversation to protect someone's feelings, admit that to yourself and have it this week. Keep it warm and direct. You choose the approach, but do not let the delay keep growing.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning this into a /li></ul></div>\n    <div class=\"block\"><h2>Where you get in your own way</h2><ul class=\"list shadows\"><li>You push people toward the version you see for them, even when it is not the one they want. What feels like belief to you can feel like pressure to them, and they either burn out trying to be your picture or quietly pull away. Either way you lose the person you were trying to build.</li><li>You spend your time growing everyone else and stop growing yourself. Your own development becomes the plan that never gets scheduled. Left long enough, you stall out while the people you coached move past you.</li><li>You invest hard in people who are not ready for it, and take their lack of progress personally. It drains you and it does not move them. Keep pouring into the wrong people and you have less left for the ones who are ready.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>Ask people what they want before you push, and aim your help at their goal instead of yours. Have that conversation directly, then adjust your coaching to what they said. The push works when the target is theirs.</p></div><div class=\"step\"><div class=\"n\">2</div><p>Put yourself back on your own development list. Pick one thing to work on this quarter and tell your team what it is. What you work on is up to you, but name it and give it real time.</p></div><div class=\"step\"><div class=\"n\">3</div><p>Read where someone stands. If they are not ready to grow, meet them there and save your deep investment for the people leaning in. You decide who is ready, but stop spending your best energy on people who are not.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning this into a plan for your team, book a conversation with me. It is free. Bring your result and the one thing you are stuck on.</p>\n      <a class=\"btn\" href=\"https://app.paperbell.com/checkout/bookings/new?package_id=227159\">Book a free conversation</a>\n    </div>\n  </div>\n","kingmaker":"\n  <div class=\"res-hero\" style=\"background:#4A356F;\">\n    <div class=\"wrap\">\n      <div class=\"res-ico\" style=\"background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAYAAAA8AXHiAABzbUlEQVR4nO29abhmV3Ue+K61zznfcKcaVaXSUFKpmEoSCK6EZi42xiYGbMB9cWIb2+lBibs7T6fTju3Ok3RRSXcSO+5OdydP3CHtAWPsQKXjxNhujG1MgRAIVIDBFCAJTSXVcEtVt+70DeecvVf/WGvvc75bVyABQuD00VO6937DGfZee613vWvYhP//2HwQIPoD8ly+9lw+/Jf+oBf6Bl7Ag+bn78k2v3j8+Luqb+Rkh3GYf3/+tPtWne+7/fhPSrAWFhay9fWXEPDME76wsJDVM1fvG6+sSqdTEACMhkC31wWGo61P3Ovi43/ynie2Pt/hbH39NAHAgQPL4ejRo/5b8Szf6cdfWsE6fPgwnzhxgp5pIvcv7O/u49t/LIx9EAK7wBlzVofg35J3um/2ZQWmDEQCAYFAkKDDRRAQASIBIgJyjFDX/7MPeJQ4sJAEMFCRLx+49+hvPcMt0uLiIh89ekiAI+H5GocX6vjLJlh06NBiDgAnThwt06uLiw6HDsktf/oX/6rg7l4JEuBxRafTf7UEgMmBRIfClwL4SghMAohQgA6T/gshgImgbwaACCIBed4lMCAkIAoQBmqp4Mej3wscqqwoXFmPPnT/fUf/9aHFxezE0eb+Dh1aLHbvXgrHjh2rv62j9TwefxkEiwDB4uLb+ejRowGGuG+9a3E+kyL3Uv8zdsX1VIvPuNjFyMFECB4IdV0CTCQiICKICOAcQxwAEDECAkQAIgXzFIcsChYIREDwoQZTCCJgCgSQBBLOc5cFCIiBuh4jiF/iTpbX1fhX807n/xmNRmfuv/99jwHA4uKiA4D2c3y3Ht+1grW4uOiWlpZo8yp/9R3/2T/MQgFi9w9y7gNeAK8CIQKPACFyKg8iTuVSTCEJQKyCEgJYHASSfMR4qJBB5dB+MrOaRhIgqKkMApCEWs8gIKIMTBCopnMdh3G58Ujm8veWfuP0ffcf/ZX2sywsHM5e+1qEI0e++0zld6Ng0fz8PVkE37fdtthDlr3akfvlUPm8W0y9wkmOalwLifMk5IhIhUOEklUDIEHAYBMdAFBFIRAwnGos2VpxEBF8CCCi1iAKYBoufiaodIFA4AAEElFmgkRQB2KX5UWBsR9A4I97KtezovtXjx1795l41vn5e/LvNu/yu0iwDjNwRJc+gJtf8yN/JafONGr5uYL6N8MTODhICCXDAUBOYJI2RBKBILQ0DsBEaGQngEybMDEkMMLXsEjxHUKACCm+iie2g4mScDKS6JlJFQASCFSLhIxzZo8anDMqP/qVvOj+2bpf/eKn7j16Qp//nQK8k74bwP53vGC1cIcHgJvu+qFDXZ75Bfjwjl42AxnXEM8g4UBwYAInYYKaKWJKUqDmK4DIQTUUAHKAqFAxwUwhQci1vvPMh4iHftGuF+wnEZwAIV6+xblGSEcgsBBAAoH4QBUJM7NjZEWBjWrlKQ//R1ddUf/MUQP8hw4tFidOHKq/kwXsO1qw2ibg1u/9qy+n0v+TDL27MnRmw7gKjMyTuMw8OABRA0Xs40HECXyLBFDriePkOpBOvgSVSiIQOXiJH46KkgExgeDNd6smUCJmS7jKGcgXM40hXdupSUSACiUCwAjwqkU9kQRkyMkRwHK6CqN/Peb13/n0vf/hQUAX3XcqL/ad a(255,255,255,.92);\">You use your influence to move other people forward, and you are glad for them to get the credit. It builds long-term loyalty, but you can end up helping everyone except yourself.</div>\n    </div>\n  </div>\n  <div class=\"wrap\">\n    <div class=\"block\"><h2>Famous leaders who share it</h2><div class=\"leaders\"><span class=\"chip\">Oprah Winfrey</span><span class=\"chip\">Simon Cowell</span></div></div>\n    <div class=\"block\"><h2>Works well with</h2><div class=\"leaders\"><span class=\"chip\">Talent Whisperer</span><span class=\"chip\">Lighthouse Keeper</span></div></div>\n    <div class=\"block\"><h2>Where you'll clash</h2><div class=\"leaders clash\"><span class=\"chip\">Diamond Cutter</span><span class=\"chip\">Explosive Cricket</span></div></div>\n    <div class=\"block\"><h2>How to work with other leaders</h2><div class=\"workwith\">You build through relationships. With a Diamond Cutter or an Explosive Cricket, be direct about your own results, because they pay more attention to results than to who you know.</div></div>\n    <div class=\"block\"><h2>Where you are strong</h2><ul class=\"list strengths\"><li>You open doors for people that they could not open on their own, and they remember it.</li><li>You care more about helping someone else succeed than about getting the credit.</li><li>You know a lot of people, and many of them owe you their start.</li></ul></div>\n    <div class=\"block\"><h2>Where you get in your own way</h2><ul class=\"list shadows\"><li>You fight for everyone else and never make the case for yourself. You will push for someone's raise and stay silent on your own. Do that long enough and you get passed over while the people you lifted move up.</li><li>You give away credit until the people who decide your future cannot see what you did. Your fingerprints are on the wins, but nobody above you knows it. When promotion time comes, there is no record of your impact to point to.</li><li>You stay so far in the background that you disappear from your own story. It feels humble, but it reads as low impact to the people who matter. Left unchecked, you become the most valuable person nobody thinks to promote.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>Keep a running list of the people you have moved forward and what came of it. Write it down as it happens so you have the record when you need it. The format is yours, just keep it current.</p></div><div class=\"step\"><div class=\"n\">2</div><p>Once a month, tell the person who decides your future what you worked on. Keep it plain: here is what I drove and here is the result. You are not bragging, you are giving them what they need to know.</p></div><div class=\"step\"><div class=\"n\">3</div><p>Ask for one thing you have earned this quarter, and start small if you need to. Pick the ask, prepare your case, and make it directly. You are good at giving. Asking for what you have earned is the part to practice.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning this into a plan for your team, book a conversation with me. It is free. Bring your result and the one thing you are stuck on.</p>\n      <a class=\"btn\" href=\"https://app.paperbell.com/checkout/bookings/new?package_id=227159\">Book a free conversation</a>\n    </div>\n  </div>\n","gear":"\n  <div class=\"res-hero\" style=\"background:#414A57;\">\n    <div class=\"wrap\">\n      <div class=\"res-ico\" style=\"background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAYAAAA8AXHiAAB8YklEQVR4nO39eZRmyXUfBv5uxFu/Jfesrbt6qW50A9UNgEABYhMEWACxsAmBC6gpWceytczSlnw8R/ZYEikdy8Ua2ZZIUeOxxke04JFkLaQllSQsBIEGIJIoEivJIkCQaGy915JVuWd+29si7vxxI+K9zKrGxsZGz8NpZNaX73tLxI17f/d3lyD8/4/DB32T3+MX9Sm+x49vdhD/OBx05syZ6PCHly9frr+Zi50/f169//3v1y/W9b7Xj/9DCdbZs2ej8XhMwAtP+NmzZ6PmyJET5d4ec5IQAGQAiqJAhgwFAKAAMiBD5r6V4+Pvv/j8C9/z jLXIgbpp7KV3v/tq955nzjwWDwbH+Y1vhP3jJEiHjz/2gtU9zp49G43HYwKAy+94h8G3YWLPnHlMtmU9A5za2bHfjWTmt+L4P5Rg3ea49f0dZ/aNHhcuAC+wYdH3HPB+MY7/HzgpAgo3odNAAAAAAElFTkSuQmCC)\"></div>\n      <div class=\"eyebrow\" style=\"color:rgba(255,255,255,.75);\">Your leadership style</div>\n      <h1 class=\"name\" style=\"color:#fff;\">The Silent Gear</h1>\n      <div class=\"essence\" style=\"color:rgba(255,255,255,.92);\">You build the systems that keep things running, with or without you. That work is quiet, so it often gets overlooked.</div>\n    </div>\n  </div>\n  <div class=\"wrap\">\n    <div class=\"block\"><h2>Famous leaders who share it</h2><div class=\"leaders\"><span class=\"chip\">Tim Cook</span><span class=\"chip\">Henry Ford</span></div></div>\n    <div class=\"block\"><h2>Works well with</h2><div class=\"leaders\"><span class=\"chip\">Lighthouse Keeper</span><span class=\"chip\">Diamond Cutter</span></div></div>\n    <div class=\"block\"><h2>Where you'll clash</h2><div class=\"leaders clash\"><span class=\"chip\">Explosive Cricket</span><span class=\"chip\">Human Espresso</span></div></div>\n    <div class=\"block\"><h2>How to work with other leaders</h2><div class=\"workwith\">You protect the systems you build. With an Explosive Cricket or a Human Espresso, ask what problem they are trying to solve before you defend the process, and keep the part of their change that helps.</div></div>\n    <div class=\"block\"><h2>Where you are strong</h2><ul class=\"list strengths\"><li>You build the routines and systems that keep a team running smoothly.</li><li>You fix problems before people even notice them.</li><li>You build things that keep working when you are not there.</li></ul></div>\n    <div class=\"block\"><h2>Where you get in your own way</h2><ul class=\"list shadows\"><li>Your best work is invisible, so people underrate it and underrate you. When nothing breaks, no one sees the system that kept it running. Left unaddressed, you get overlooked for the calm you created and passed over for people who look busier.</li><li>You add process where a quick conversation would do. Each rule feels reasonable, but they stack up until the system serves itself instead of the people using it. Over time the team spends more energy following the process than doing the work.</li><li>You hold on to systems you built even after they stop fitting. What worked last year quietly becomes the thing slowing everyone down. Refuse to change it and your strength turns into the reason the team cannot adapt.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>Once a month, show your boss or team what your systems prevented, using real numbers: this did not break, here is why. Keep it short and concrete. How you surface it is up to you, but make the invisible visible.</p></div><div class=\"step\"><div class=\"n\">2</div><p>Take one system and ask the people who use it where it slows them down. Cut the step that exists for the system's sake, not theirs. You decide what stays, but let their friction guide the trim.</p></div><div class=\"step\"><div class=\"n\">3</div><p>Every quarter, put one of your own systems up for review and change it if the situation has moved. Question it like an outsider would. Keep what still works, rebuild what does not.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning this into a plan for your team, book a conversation with me. It is free. Bring your result and the one thing you are stuck on.</p>\n      <a class=\"btn\" href=\"https://app.paperbell.com/checkout/bookings/new?package_id=227159\">Book a free conversation</a>\n    </div>\n  </div>\n","cricket":"\n  <div class=\"res-hero\" style=\"background:#B23A2E;\">\n    <div class=\"wrap\">\n      <div class=\"res-ico\" style=\"background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAYAAAA8AXHiAACHX0lEQVR4nOz9d GDhWp6sq4gSeyp3zlxer9b1x7tF8WuNb5qCqCgI2TVSSNEo2/APBYjEMbOK/nYX/N/juuBVvyIA8Hw9kWPLP/hx+5gHFxbKPZddpvjQh+RSAeLnIm96xWpLW8n2HHjSnw8LcXBhoQQALACnT79VNrOkb0b5f6VYG2UTrhN3j0DA6Bz2toi7F88G2RdLiuV8y/8B1JN3P1QiZl8AAAAASUVORK5CYII=)\"></div>\n      <div class=\"eyebrow\" style=\"color:rgba(255,255,255,.75);\">Your leadership style</div>\n      <h1 class=\"name\" style=\"color:#fff;\">The Explosive Cricket</h1>\n      <div class=\"essence\" style=\"color:rgba(255,255,255,.92);\">You do not let broken things sit, and you ask the questions others avoid. That is how overdue changes happen. Done wrong, it costs you the people you need to make the change stick.</div>\n    </div>\n  </div>\n  <div class=\"wrap\">\n    <div class=\"block\"><h2>Famous leaders who share it</h2><div class=\"leaders\"><span class=\"chip\">Steve Jobs</span><span class=\"chip\">Elon Musk</span></div></div>\n    <div class=\"block\"><h2>Works well with</h2><div class=\"leaders\"><span class=\"chip\">Calm Juggernaut</span><span class=\"chip\">Lighthouse Keeper</span></div></div>\n    <div class=\"block\"><h2>Where you'll clash</h2><div class=\"leaders clash\"><span class=\"chip\">Silent Gear</span><span class=\"chip\">Diamond Cutter</span></div></div>\n    <div class=\"block\"><h2>How to work with other leaders</h2><div class=\"workwith\">You push for change fast. With a Silent Gear or a Diamond Cutter, bring the fix along with the problem and give them time to adjust, because they do not like being surprised by change.</div></div>\n    <div class=\"block\"><h2>Where you are strong</h2><ul class=\"list strengths\"><li>You do not let a broken process slide. You say what other people are thinking.</li><li>You notice the things everyone else has gotten used to.</li><li>You are often the reason things get better instead of staying the same.</li></ul></div>\n    <div class=\"block\"><h2>Where you get in your own way</h2><ul class=\"list shadows\"><li>You push back so often that people brace for you, and your important challenges get lumped in with the small ones and ignored. The signal gets lost in the noise. Keep it up and the one time it matters, no one is listening.</li><li>You argue out of habit sometimes, not because it matters. The friction adds up and pushes away the people you will need for the fights that count. Spend your energy on everything and you have no allies left for the thing that has to change.</li><li>You spend goodwill faster than you build it. Being right does not move anything if the room has stopped trusting how you deliver it. Burn through enough goodwill and good ideas start dying on the table because they came from you.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>Before you raise something, decide if it is worth the friction, and let the small things go. Rank what needs to change and spend your voice there. You pick the battles, but pick fewer of them.</p></div><div class=\"step\"><div class=\"n\">2</div><p>When you point out a problem, bring a suggested fix with it. Frame it as 'here is what is broken and here is what I would try.' You do not need the perfect answer, just a starting point that shows you are solving, not only complaining.</p></div><div class=\"step\"><div class=\"n\">3</div><p>Build goodwill when things are calm, on purpose. Back someone else's idea out loud, or support a change that is not yours, this week. That trust makes it easier the next time you need to push on something.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning this into a plan for your team, book a conversation with me. It is free. Bring your result and the one thing you are stuck on.</p>\n      <a class=\"btn\" href=\"https://app.paperbell.com/checkout/bookings/new?package_id=227159\">Book a free conversation</a>\n    </div>\n  </div>\n","grizzly":"\n  <div class=\"res-hero\" style=\"background: n></div></div>\n    <div class=\"block\"><h2>How to work with other leaders</h2><div class=\"workwith\">You make it safe to be honest. With an Explosive Cricket or a Diamond Cutter, add a clear next step after you listen, so being easy to talk to does not turn into nothing changing.</div></div>\n    <div class=\"block\"><h2>Where you are strong</h2><ul class=\"list strengths\"><li>People bring you bad news first because they know you will stay calm.</li><li>When someone makes a mistake, you ask questions instead of getting angry.</li><li>You admit your own mistakes, so your team knows it is safe to be honest.</li></ul></div>\n    <div class=\"block\"><h2>Where you get in your own way</h2><ul class=\"list shadows\"><li>Because you are easy to talk to, the standard can quietly slide. People feel safe, but they stop feeling the line. Let it drift long enough and 'safe to be honest' turns into 'nothing has to change.'</li><li>You hear a problem and stay so calm that you do not push hard enough to fix it. People feel understood, but the issue sits there. Keep absorbing without acting and your team learns that telling you is the same as solving it.</li><li>Some people read your patience as room to coast, and because you hate being the heavy, you let it run. One person's slack becomes the team's new normal. Left alone, your best people resent carrying the ones you will not address.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>When someone brings you a problem, thank them and then agree on the next step in the same conversation. Do not end on 'thanks for telling me.' End on who does what by when.</p></div><div class=\"step\"><div class=\"n\">2</div><p>Split it into two moves on purpose: first make it safe to say, then set the expectation for fixing it. Both, every time. You choose the words, but do not skip the second half.</p></div><div class=\"step\"><div class=\"n\">3</div><p>If someone is using your patience to coast, talk to them about it directly this week. Name what you are seeing and what you expect. You can stay kind, but the conversation has to happen.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning this into a plan for your team, book a conversation with me. It is free. Bring your result and the one thing you are stuck on.</p>\n      <a class=\"btn\" href=\"https://app.paperbell.com/checkout/bookings/new?package_id=227159\">Book a free conversation</a>\n    </div>\n  </div>\n","turtle":"\n  <div class=\"res-hero\" style=\"background:#4E6B2E;\">\n    <div class=\"wrap\">\n      <div class=\"res-ico\" style=\"background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAYAAAA8AXHiAACDEElEQVR4nOz9d7xd13Xfi37HnKvsdgrOQScBsJMCi0hBlKgK9UKRkiwJvonsRC4JHSfX98Y3xU5uEohpjn3te/3iPMumJdlybMcWLEsUVahq07IpsUCiWMAGgkTv5+CU3dZac877x5xz7X1AUhLVlfeWPhSAc/Zee+21xhzjN37jN8YU/v/H2Yc4B/Kc34X7XlzMj+rxnO/f/0SH3HTTtmQ3sA2If95yy+7y2znZzp071dGjn9DxPIRz7v42z/ejfvz/lGFt37k9ufTossCzG9D27duTzdelGxcXhy4zVvrh582x1/TPek+z0WTXf/38gW/2mfPzF9hdu3aZ7/Br/Egc/9Ma1s6dO9WePXvk2R7k9u3bG2uvcu8uiqEVUUpZm4hzlUW/vdHKbhwMShCHAhCH4BCrcIATcIA4AVFoLZRF+R8d8qQTp8SJ1VphSld87AN3/tGzXKLs2LFDbd26y918M/Z7dBt+YMf/bIYlO3ZsTQF27dpTxB/u+PAOvfWhre5rR7/w24l268vKWYU5pz3ZfJE1/pmKcyjlqApDVRqHiFjnnJJoReAfvyAC1ok3NhGsszSaqaAg4jMRjTGOYlh+3OHKrJHq3sB89gUbXv+7sCe5+eZdo+vbsTU7sXWNvePmO6rv5836Xh7/MxiW4GDHj+9Qu3btsngz4C0///JtmXNpVbn/K8305dZUJknVahHxX9paqsIUCGLAaUFEcA6nxaGVUlhrQCS4qPgCV3+siOBw4RNN5ZxYRHDWiog4nFNZM0/AggjlwADuhG4kaTGoPtBu5x9Z7g2O3fq7dz0FsGPHDg0w/j1+VI8fWcPasWOHPrH1hJy9ym+46eX/PsGC8G+zRkJVGJwzOOew1hqNcsqBFSfiRCMOJw6FxjkwUqERlAhOHIKCYDzOKbyfcgiCVWCtRY+ZgBMNOMSCw2LEVuEXaJEELVjn0BqyRkZvabgvzZI/tqU5+he33PW+8e+yfef25FW8yt58880/cqHyR8+wHHLTz21LIvi+bsd1zdXTyYuSVP26K4q00cmej3MMe0PnnDMiSo99SznrXCFugQrGUlmHFv8yC2hxIIJ1gnLBeTmHDu+zznlDQYETIqBTAjiLFUGUNyacQ5Bghs45Y22SJEnWSimGFda43RZZnp7I/s6Hfv2OY/Eyb7ppW/rtZqs/qONH ss=\"wrap\">\n    <div class=\"block\"><h2>Famous leaders who share it</h2><div class=\"leaders\"><span class=\"chip\">Warren Buffett</span><span class=\"chip\">Jeff Bezos</span><span class=\"chip\">Kobe Bryant</span></div></div>\n    <div class=\"block\"><h2>Works well with</h2><div class=\"leaders\"><span class=\"chip\">Silent Gear</span><span class=\"chip\">Diamond Cutter</span></div></div>\n    <div class=\"block\"><h2>Where you'll clash</h2><div class=\"leaders clash\"><span class=\"chip\">Explosive Cricket</span><span class=\"chip\">Lighthouse Keeper</span></div></div>\n    <div class=\"block\"><h2>How to work with other leaders</h2><div class=\"workwith\">You move at a steady pace. With an Explosive Cricket or a Lighthouse Keeper who wants to move now, show them your plan and where it leads, so your pace does not look like stalling.</div></div>\n    <div class=\"block\"><h2>Where you are strong</h2><ul class=\"list strengths\"><li>You keep a steady pace and get results over time while others burn out.</li><li>People trust you to finish what you start.</li><li>You do not get thrown off by the pace around you. You show up the same every day.</li></ul></div>\n    <div class=\"block\"><h2>Where you get in your own way</h2><ul class=\"list shadows\"><li>Sometimes a moment needs speed and you hold your normal pace. Your steadiness is a strength until the one time the situation called for real speed and you missed it. Miss enough of those and people stop bringing you the time-sensitive work.</li><li>Your consistency can look like you do not care when something is urgent. The team reads your calm pace as indifference and either panics or works around you. Left unexplained, your steadiness makes them doubt you when it matters most.</li><li>You focus on the long game and forget to mark progress along the way. Without checkpoints, the team feels like nothing is moving, even when it is. Over time they lose motivation on work that is on track.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>Learn to spot a moment that needs real speed. When one comes, say so, move fast for that stretch, then return to your pace. You judge when it is real, but make the shift visible when it is.</p></div><div class=\"step\"><div class=\"n\">2</div><p>When you are going slow on purpose, tell people why and where it leads. A short 'here is the plan and here is why we are not rushing' turns your patience into strategy they can follow.</p></div><div class=\"step\"><div class=\"n\">3</div><p>Mark progress every few weeks so the team can see movement. Call out what is done and what is next. The format is yours, but do not let a long project run silent.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning this into a plan for your team, book a conversation with me. It is free. Bring your result and the one thing you are stuck on.</p>\n      <a class=\"btn\" href=\"https://app.paperbell.com/checkout/bookings/new?package_id=227159\">Book a free conversation</a>\n    </div>\n  </div>\n","lighthouse":"\n  <div class=\"res-hero\" style=\"background:#21406B;\">\n    <div class=\"wrap\">\n      <div class=\"res-ico\" style=\"background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJYAAACWCAYAAAA8AXHiAAB5JklEQVR4nO39eZQlyXUfBv/ujYjMfEtV9T7ds2J2oLGzSZHE1tjFBRIp0iXKpEyKh9ZY0rHO588WF/NYbrYla4HoT7bkQ0iwJRGkAJJorhBAggABorFRJNjYCPQAs+/d03vX8t7LzIi4/uNGZGbV9AxmwAEwoL+YU1NdVe/ly4y4ce/v/u4ShP//2D4IkK/mbV/Nm/7CDvpG38A3cNChQ3fY7b88ceLt7Vd1tSNH+NB7T5ln7Xrf5OP/VYJ1+PARu7FxioAnX/DDhw/bs0u3X11fvixlWRDmgz+OBv+ep5/nAEYjnPyDtz/0FT/zposRx46FZ+VhnuPjL65gHTnCOHmSnmwhbzj8Y9VSWfxwnM+jELEHWwZ5lvj9pqj+SvANiBgRAARgAAAjkoAgIAGEAIBAbOH94h8b0P1M4MgcAQCtb+78+C/9xye5Q1pdXeVjxw4KcDQ+68//DR5/0QSLDh5cdQBw8uSxJv9ydfXd5tixL8oLDt/9C8a4/THEKGKuKarpX0IMABFCTBApeITQCJEhQETAgAAEAYggYESRfuKIAETYoiIigEQQibtr+dC+B9K2zlWm9osP3HX8xn97cBX25LGj e they move once they understand it too.</div></div>\n    <div class=\"block\"><h2>Where you are strong</h2><ul class=\"list strengths\"><li>You see problems coming before other people do.</li><li>Your team is rarely surprised by a problem.</li><li>You make the right move early, before others see why.</li></ul></div>\n    <div class=\"block\"><h2>Where you get in your own way</h2><ul class=\"list shadows\"><li>You think so far ahead that you leave the people in the present behind. What is obvious to you is invisible to them, so they cannot act on a move they do not see coming. The gap grows until you are leading a plan alone.</li><li>You struggle to explain what you already know is coming, so your early calls sound like hunches. People hesitate to act on a hunch. When they wait for proof, the early advantage you saw disappears.</li><li>You spend so much on the future that today slips: the check-in you skipped, the person in front of you who needed you. Your team lives in the present, and if you are never there, they stop feeling led even while you protect them.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>Turn what you see into the next concrete step people can take now. Give them the move and the reason, not the whole map. You hold the long view, just translate it into one action at a time.</p></div><div class=\"step\"><div class=\"n\">2</div><p>When you make an early call, show your work. Walk people through how you got there so they learn to trust the pattern. Do it enough and they will move before they fully understand it.</p></div><div class=\"step\"><div class=\"n\">3</div><p>Block real time to be present this week, not just planning. Put the check-ins and one-on-ones on the calendar and protect them. How you show up is yours, but be in today too.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning BASmoUnRlA5sEAHIG9Qx3qpwS7wp5mD3YmX3UHvMpT3vOwH4mVEZ89Jfn54jun3z/pAZjIdVLeYqItxw5WA1o3yuaCCogUxEw+FhsmV2HNBuJZ2Mz5VJIPksUimUE6xrCUCvniKjI3e2i2G2iiiKUGQul8rLiQ0AQq7K8g+p3njcuNznaf/HD3YRzS0I3H4+5Ut9LRaRn2M7G6oGpYFdu/b2v+Zw+HQzeuxvbupP+lA1dSQxzzWec8TAgICplJ3KFLJnEMAktsnprvwcWWWmTzsrZyIUY5zVGMogGAtdOmwljJbxRRS/OE2XT6Jyl/WxwoS2i49umHp2+NRqOWQFVVlZubm/aya6VeBdaFWHPEXXwsq+M+9vGJsw50iMVEVd/zRXFRm3j2IpRixErJPBknrUpb/aojlyN3MkZ5IxEpdt2m4kKDmZiBPodpzZuew9/1T0++v3d/6TNXY8v63Tpg/Yi1gMFg4Hd3dwkAFiNBdeaDt6memalRLShKhwZEn3m/ca6ZNYHNPDqkylUzsQM73oONlb1jE/1CfP2zNJ5d4RUAXNPogzs//tb9zn6/X/R6Pbtz6pTmnYZ1xNoTq4sFkglewX5aOi8ZAHDv6FF9GR0xq4j/FbGWYNn4CZcu/fs7jUbA8iR73yXe/wX+ATgrkXKXRe9ZAAAAAElFTkSuQmCC)\"></div>\n      <div class=\"eyebrow\" style=\"color:rgba(255,255,255,.75);\">Your leadership style</div>\n      <h1 class=\"name\" style=\"color:#fff;\">The Diamond Cutter</h1>\n      <div class=\"essence\" style=\"color:rgba(255,255,255,.92);\">You hold a high standard, and the work is better for going through you. The problem is the standard lives in you, which makes you the bottleneck.</div>\n    </div>\n  </div>\n  <div class=\"wrap\">\n    <div class=\"block\"><h2>Famous leaders who share it</h2><div class=\"leaders\"><span class=\"chip\">Gordon Ramsay</span><span class=\"chip\">Anna Wintour</span></div></div>\n    <div class=\"block\"><h2>Works well with</h2><div class=\"leaders\"><span class=\"chip\">Silent Gear</span><span class=\"chip\">Calm Juggernaut</span></div></div>\n    <div class=\"block\"><h2>Where you'll clash</h2><div class=\"leaders clash\"><span class=\"chip\">Human Espresso</span><span class=\"chip\">Explosive Cricket</span></div></div>\n    <div class=\"block\"><h2>How to work with other leaders</h2><div class=\"workwith\">You hold a high standard. With a Human Espresso or an Explosive Cricket, agree on what good enough looks like up front, so your standard does not become the thing that slows everyone down.</div></div>\n    <div class=\"block\"><h2>Where you are strong</h2><ul class=\"list strengths\"><li>You catch the mistakes other people miss.</li><li>People trust the work when your name is on it.</li><li>You set the standard the whole team works to.</li></ul></div>\n    <div class=\"block\"><h2>Where you get in your own way</h2><ul class=\"list shadows\"><li>Everything routes back to you to check, so the work waits on you. Your standard has quietly made you the bottleneck the whole team is stuck behind. Keep it up and your team's speed is capped at whatever you can personally review.</li><li>You keep improving things past the point it helps. The last ten percent takes the most time and moves the result the least. Over-polish enough and you miss deadlines chasing a difference no one else can see.</li><li>People stop reaching for their best because they know you will fix it anyway. Without meaning to, you have trained them to hand you the rough version. The more you catch, the less they try, and the gap between your standard and theirs grows.</li></ul></div>\n    <div class=\"block\"><h2>What to work on</h2><div class=\"training\"><div class=\"step\"><div class=\"n\">1</div><p>Take one thing you always check and write down the three things that make it good. Hand it to someone with that list as the bar and let them own it. You are teaching your eye, not giving up the standard.</p></div><div class=\"step\"><div class=\"n\">2</div><p>Decide what finished looks like before the work starts, so precision serves the deadline instead of eating it. Not everything earns your top gear. You set the level, just set it on purpose.</p></div><div class=\"step\"><div class=\"n\">3</div><p>When someone hands you work that is good enough, leave it. Let the small imperfection stand so they learn to own the quality themselves. It will feel uncomfortable at first, and that is fine.</p></div></div></div>\n    <div class=\"cta\">\n      <h3>Want to take this further?</h3>\n      <p>If you want help turning this into a plan for your team, book a conversation with me. It is free. Bring your result and the one thing you are stuck on.</p>\n      <a class=\"btn\" href=\"https://app.paperbell.com/checkout/bookings/new?package_id=227159\">Book a free conversation</a>\n    </div>\n  </div>\n"};

var A={"lion": {"name": "The Kneeling Lion", "color": "9C6B2E", "essence": "You lead by carrying weight for your people, and it earns you real loyalty. The downside is you end up holding things that should belong to someone else.", "leaders": ["Nelson Mandela", "Martin Luther King Jr.", "Mother Teresa"], "partners": ["Talent Whisperer", "Gentle Grizzly"], "clash": ["Explosive Cricket", "Diamond Cutter"], "workwith": "You try to smooth things over for everyone. With an Explosive Cricket or a Diamond Cutter, let them handle the hard conversation themselves instead of stepping in to take it on.", "strengths": ["When your team messes up, you take responsibility in front of others and handle the details privately. People trust you for it.", "You know what is going on in your people's lives, not just their work. You can tell when someone is off.", "You will do the jobs nobody wants so your team does not have to."], "shadows": ["You take on parts of other people's jobs. When you do, you teach your team that anything hard is yours to handle, so they stop stretching and wait for you. Keep it up and you become the bottleneck for a group that could have run itself.", "You step in and fix problems before your people work through them. The struggle you remove is usually where the learning happens, so they stay dependent on you. Over time you end up with a team that cannot function without you in the room.", "You put yourself last, over and over. It looks like dedication, but it drains the energy and patience your team needs from you. Left unchecked it turns into burnout, and a burned-out leader helps no one."], "training": ["Give back one task you have taken on that belongs to someone else. Hand it over directly, tell them you are there if they get stuck, then let them run it their way. Do not step back in unless they ask.", "Before you jump in to help, decide whether the person is stuck or just uncomfortable. If it is only discomfort, stay out and check in afterward. Let the situation teach them, and coach after, not during.", "Pick one limit and hold it this week, like leaving at a set time or turning down a task that is not yours. Say it to your team so they see it. How you draw the line is up to you, but draw one."]}, "espresso": {"name": "The Human Espresso", "color": "C05A2A", "essence": "You lift the energy of a room, and a team that feels good tends to work harder and stay longer. The risk is that it all runs on you being there.", "leaders": ["Richard Branson", "Tony Robbins", "Magic Johnson"], "partners": ["Talent Whisperer", "Lighthouse Keeper"], "clash": ["Diamond Cutter", "Silent Gear"], "workwith": "You lead with energy and can skip past the details. With a Diamond Cutter or a Silent Gear, slow down, get specific, and give them a clear plan.", "strengths": ["You can walk into a tired room and lift the mood. People work better when you are around.", "People want to be on your team, and they give you their best.", "You can tell how a room is feeling and adjust to it."], "shadows": ["You avoid the conversations that might cool the mood. The problem you dance around does not go away, it grows, and your people notice you will not name it. Over time they stop trusting you with the hard stuff, and the standard quietly drops.", "The team runs on your energy. That feels good until the day you are tired, distracted, or out, and the whole group sinks with you. A team that only performs when you are up cannot hold itself together.", "You pour energy outward and rarely refill your own. The empty tank shows up first at home and in your patience, then in the work. Ignore it long enough and the thing people love about you burns out."], "training": ["Have the one conversation you have been keeping light. Name the issue plainly, stay warm, and say what needs to change. You choose the words, but do not leave without saying the hard part.", "Build one thing that holds the energy when you are gone, like a daily standup, a shared win you track, or a teammate who owns the mood. Pick the one that fits your team and put it in place this month.", "List what drains you and remove one of those things this month. Protect that time the way you protect the work. How you refill is yours to figure out, but do it before you are empty."]}, "juggernaut": {"name": "The Calm Juggernaut", "color": "2F5169", "essence": "You slow down when things speed up, and that steadiness holds the team together. It can also come across as distance, and it can make you slow to move when speed is needed.", "leaders": ["Barack Obama", "Angela Merkel", "Sully Sullenberger"], "partners": ["Explosive Cricket", "Diamond Cutter"], "clash": ["Human Espresso", "Lighthouse Keeper"], "workwith": "Your calm can look like slowness to people who move fast. With a Lighthouse Keeper or a Human Espresso, tell them when you agree but want to wait, and when you are ready to move now, so they do not read your calm as resistance.", "strengths": ["You stay calm in a crisis, and that keeps the team calm.", "People trust you to make good decisions under pressure.", "You handle a lot without showing stress, so the team feels safe when things are uncertain."], "shadows": ["When you go quiet, people cannot read you, so they fill the silence with worry. Your calm is meant to steady them, but without words it does the opposite. Say nothing long enough and a steady team starts to feel anxious and left in the dark.", "Some moments need speed, and you hold your usual pace. To the team it looks like you do not see the fire, so they either panic or wait on you. Miss enough of those and people stop bringing you the urgent things.", "You hold stress in and let none of it out. It does not disappear, it moves into your sleep, your health, and the people at home. Carry it silently long enough and it shows up as a health problem or a strained relationship, not a work one."], "training": ["Once a day, say what you are thinking or watching for out loud. A short 'here is what is on my mind' gives people the read they need. Keep it brief, but do not leave them guessing.", "Learn to name urgency. When something needs speed, say so and move faster on purpose so the team can tell it apart from your normal steadiness. You set the threshold, but make the shift visible.", "Pick a real outlet for the pressure that is not your family or your body, like exercise, a walk, or a person you talk to each week. Choose what works for you and make it a habit, not a once-in-a-while."]}, "velvet": {"name": "The Velvet Hammer", "color": "6E2F48", "essence": "You hold a high standard without damaging the relationship. The work is making the standard clear and getting your people to hold it without you.", "leaders": ["Michelle Obama", "Jacinda Ardern"], "partners": ["Gentle Grizzly", "Talent Whisperer"], "clash": ["Human Espresso", "Explosive Cricket"], "workwith": "You hold the standard and the relationship. With a Human Espresso or an Explosive Cricket, state the standard clearly up front so it does not get dodged or argued away.", "strengths": ["You can tell someone a hard truth and keep the relationship. You are honest without being harsh.", "People respect you and do not want to let you down.", "You make tough calls without turning them into a fight."], "shadows": ["You are kind about the standard, so people cannot always tell where your line is until they have crossed it. They are not trying to fail you, they just cannot see the bar. When the line stays invisible, good people miss it and feel blindsided when you finally react.", "You hold the standard yourself, fixing and covering, instead of teaching your people to hold it. It works while you are watching. Step away and the quality drops, because it lived in you and never got built into them.", "You wait too long to act on a problem because you do not want to bruise the relationship. The delay lets the issue grow and lets the person keep going wrong. By the time you address it, the fix is harder and the conversation lands worse than it would have early."], "training": ["Say what good looks like before the work starts, and name the line clearly, in your own words, so there is no guessing. Do this at the front of a project, not after it slips.", "When you catch yourself fixing something to keep the peace, stop and hand it back with the expectation attached. Explain the standard once, then let them do it, even if the first pass is rough. How you coach it is yours, but do not take it back.", "When you are avoiding a hard conversation to protect someone's feelings, admit that to yourself and have it this week. Keep it warm and direct. You choose the approach, but do not let the delay keep growing."]}, "whisperer": {"name": "The Talent Whisperer", "color": "1F6E57", "essence": "You see what people could become and push them toward it. That grows people others would give up on. The risk is pushing them toward your version of them instead of theirs.", "leaders": ["Phil Jackson", "John Wooden", "Coach K (Mike Krzyzewski)"], "partners": ["Kneeling Lion", "Invisible Kingmaker"], "clash": ["Diamond Cutter", "High-Octane Turtle"], "workwith": "You push people to grow. With a Diamond Cutter or a High-Octane Turtle, ease off and let them move at their own pace instead of yours.", "strengths": ["You see what someone could become, and you help them get there.", "You give honest feedback that most people avoid, and people remember it years later.", "You look at what someone could grow into, not just what they do now."], "shadows": ["You push people toward the version you see for them, even when it is not the one they want. What feels like belief to you can feel like pressure to them, and they either burn out trying to be your picture or quietly pull away. Either way you lose the person you were trying to build.", "You spend your time growing everyone else and stop growing yourself. Your own development becomes the plan that never gets scheduled. Left long enough, you stall out while the people you coached move past you.", "You invest hard in people who are not ready for it, and take their lack of progress personally. It drains you and it does not move them. Keep pouring into the wrong people and you have less left for the ones who are ready."], "training": ["Ask people what they want before you push, and aim your help at their goal instead of yours. Have that conversation directly, then adjust your coaching to what they said. The push works when the target is theirs.", "Put yourself back on your own development list. Pick one thing to work on this quarter and tell your team what it is. What you work on is up to you, but name it and give it real time.", "Read where someone stands. If they are not ready to grow, meet them there and save your deep investment for the people leaning in. You decide who is ready, but stop spending your best energy on people who are not."]}, "kingmaker": {"name": "The Invisible Kingmaker", "color": "4A356F", "essence": "You use your influence to move other people forward, and you are glad for them to get the credit. It builds long-term loyalty, but you can end up helping everyone except yourself.", "leaders": ["Oprah Winfrey", "Simon Cowell"], "partners": ["Talent Whisperer", "Lighthouse Keeper"], "clash": ["Diamond Cutter", "Explosive Cricket"], "workwith": "You build through relationships. With a Diamond Cutter or an Explosive Cricket, be direct about your own results, because they pay more attention to results than to who you know.", "strengths": ["You open doors for people that they could not open on their own, and they remember it.", "You care more about helping someone else succeed than about getting the credit.", "You know a lot of people, and many of them owe you their start."], "shadows": ["You fight for everyone else and never make the case for yourself. You will push for someone's raise and stay silent on your own. Do that long enough and you get passed over while the people you lifted move up.", "You give away credit until the people who decide your future cannot see what you did. Your fingerprints are on the wins, but nobody above you knows it. When promotion time comes, there is no record of your impact to point to.", "You stay so far in the background that you disappear from your own story. It feels humble, but it reads as low impact to the people who matter. Left unchecked, you become the most valuable person nobody thinks to promote."], "training": ["Keep a running list of the people you have moved forward and what came of it. Write it down as it happens so you have the record when you need it. The format is yours, just keep it current.", "Once a month, tell the person who decides your future what you worked on. Keep it plain: here is what I drove and here is the result. You are not bragging, you are giving them what they need to know.", "Ask for one thing you have earned this quarter, and start small if you need to. Pick the ask, prepare your case, and make it directly. You are good at giving. Asking for what you have earned is the part to practice."]}, "gear": {"name": "The Silent Gear", "color": "414A57", "essence": "You build the systems that keep things running, with or without you. That work is quiet, so it often gets overlooked.", "leaders": ["Tim Cook", "Henry Ford"], "partners": ["Lighthouse Keeper", "Diamond Cutter"], "clash": ["Explosive Cricket", "Human Espresso"], "workwith": "You protect the systems you build. With an Explosive Cricket or a Human Espresso, ask what problem they are trying to solve before you defend the process, and keep the part of their change that helps.", "strengths": ["You build the routines and systems that keep a team running smoothly.", "You fix problems before people even notice them.", "You build things that keep working when you are not there."], "shadows": ["Your best work is invisible, so people underrate it and underrate you. When nothing breaks, no one sees the system that kept it running. Left unaddressed, you get overlooked for the calm you created and passed over for people who look busier.", "You add process where a quick conversation would do. Each rule feels reasonable, but they stack up until the system serves itself instead of the people using it. Over time the team spends more energy following the process than doing the work.", "You hold on to systems you built even after they stop fitting. What worked last year quietly becomes the thing slowing everyone down. Refuse to change it and your strength turns into the reason the team cannot adapt."], "training": ["Once a month, show your boss or team what your systems prevented, using real numbers: this did not break, here is why. Keep it short and concrete. How you surface it is up to you, but make the invisible visible.", "Take one system and ask the people who use it where it slows them down. Cut the step that exists for the system's sake, not theirs. You decide what stays, but let their friction guide the trim.", "Every quarter, put one of your own systems up for review and change it if the situation has moved. Question it like an outsider would. Keep what still works, rebuild what does not."]}, "cricket": {"name": "The Explosive Cricket", "color": "B23A2E", "essence": "You do not let broken things sit, and you ask the questions others avoid. That is how overdue changes happen. Done wrong, it costs you the people you need to make the change stick.", "leaders": ["Steve Jobs", "Elon Musk"], "partners": ["Calm Juggernaut", "Lighthouse Keeper"], "clash": ["Silent Gear", "Diamond Cutter"], "workwith": "You push for change fast. With a Silent Gear or a Diamond Cutter, bring the fix along with the problem and give them time to adjust, because they do not like being surprised by change.", "strengths": ["You do not let a broken process slide. You say what other people are thinking.", "You notice the things everyone else has gotten used to.", "You are often the reason things get better instead of staying the same."], "shadows": ["You push back so often that people brace for you, and your important challenges get lumped in with the small ones and ignored. The signal gets lost in the noise. Keep it up and the one time it matters, no one is listening.", "You argue out of habit sometimes, not because it matters. The friction adds up and pushes away the people you will need for the fights that count. Spend your energy on everything and you have no allies left for the thing that has to change.", "You spend goodwill faster than you build it. Being right does not move anything if the room has stopped trusting how you deliver it. Burn through enough goodwill and good ideas start dying on the table because they came from you."], "training": ["Before you raise something, decide if it is worth the friction, and let the small things go. Rank what needs to change and spend your voice there. You pick the battles, but pick fewer of them.", "When you point out a problem, bring a suggested fix with it. Frame it as 'here is what is broken and here is what I would try.' You do not need the perfect answer, just a starting point that shows you are solving, not only complaining.", "Build goodwill when things are calm, on purpose. Back someone else's idea out loud, or support a change that is not yours, this week. That trust makes it easier the next time you need to push on something."]}, "grizzly": {"name": "The Gentle Grizzly", "color": "5B4636", "essence": "People bring you bad news first, because they know you will not blow up. That is rare and valuable. The thing to watch is that being easy to talk to can turn into letting the standard slide.", "leaders": ["Abraham Lincoln", "Satya Nadella"], "partners": ["Velvet Hammer", "Kneeling Lion"], "clash": ["Explosive Cricket", "Diamond Cutter"], "workwith": "You make it safe to be honest. With an Explosive Cricket or a Diamond Cutter, add a clear next step after you listen, so being easy to talk to does not turn into nothing changing.", "strengths": ["People bring you bad news first because they know you will stay calm.", "When someone makes a mistake, you ask questions instead of getting angry.", "You admit your own mistakes, so your team knows it is safe to be honest."], "shadows": ["Because you are easy to talk to, the standard can quietly slide. People feel safe, but they stop feeling the line. Let it drift long enough and 'safe to be honest' turns into 'nothing has to change.'", "You hear a problem and stay so calm that you do not push hard enough to fix it. People feel understood, but the issue sits there. Keep absorbing without acting and your team learns that telling you is the same as solving it.", "Some people read your patience as room to coast, and because you hate being the heavy, you let it run. One person's slack becomes the team's new normal. Left alone, your best people resent carrying the ones you will not address."], "training": ["When someone brings you a problem, thank them and then agree on the next step in the same conversation. Do not end on 'thanks for telling me.' End on who does what by when.", "Split it into two moves on purpose: first make it safe to say, then set the expectation for fixing it. Both, every time. You choose the words, but do not skip the second half.", "If someone is using your patience to coast, talk to them about it directly this week. Name what you are seeing and what you expect. You can stay kind, but the conversation has to happen."]}, "turtle": {"name": "The High-Octane Turtle", "color": "4E6B2E", "essence": "You get results by staying consistent over time, not in short bursts. The risk is missing the moments that call for real speed.", "leaders": ["Warren Buffett", "Jeff Bezos", "Kobe Bryant"], "partners": ["Silent Gear", "Diamond Cutter"], "clash": ["Explosive Cricket", "Lighthouse Keeper"], "workwith": "You move at a steady pace. With an Explosive Cricket or a Lighthouse Keeper who wants to move now, show them your plan and where it leads, so your pace does not look like stalling.", "strengths": ["You keep a steady pace and get results over time while others burn out.", "People trust you to finish what you start.", "You do not get thrown off by the pace around you. You show up the same every day."], "shadows": ["Sometimes a moment needs speed and you hold your normal pace. Your steadiness is a strength until the one time the situation called for real speed and you missed it. Miss enough of those and people stop bringing you the time-sensitive work.", "Your consistency can look like you do not care when something is urgent. The team reads your calm pace as indifference and either panics or works around you. Left unexplained, your steadiness makes them doubt you when it matters most.", "You focus on the long game and forget to mark progress along the way. Without checkpoints, the team feels like nothing is moving, even when it is. Over time they lose motivation on work that is on track."], "training": ["Learn to spot a moment that needs real speed. When one comes, say so, move fast for that stretch, then return to your pace. You judge when it is real, but make the shift visible when it is.", "When you are going slow on purpose, tell people why and where it leads. A short 'here is the plan and here is why we are not rushing' turns your patience into strategy they can follow.", "Mark progress every few weeks so the team can see movement. Call out what is done and what is next. The format is yours, but do not let a long project run silent."]}, "lighthouse": {"name": "The Lighthouse Keeper", "color": "21406B", "essence": "You see problems coming before others do, and you steer the team around them early. The hard part is bringing people with you when you can see something they cannot yet.", "leaders": ["Bill Gates", "Walt Disney"], "partners": ["Silent Gear", "Invisible Kingmaker"], "clash": ["High-Octane Turtle", "Calm Juggernaut"], "workwith": "You see it early. With a High-Octane Turtle or a Calm Juggernaut, turn what you see into a clear next step and explain why, because they move once they understand it too.", "strengths": ["You see problems coming before other people do.", "Your team is rarely surprised by a problem.", "You make the right move early, before others see why."], "shadows": ["You think so far ahead that you leave the people in the present behind. What is obvious to you is invisible to them, so they cannot act on a move they do not see coming. The gap grows until you are leading a plan alone.", "You struggle to explain what you already know is coming, so your early calls sound like hunches. People hesitate to act on a hunch. When they wait for proof, the early advantage you saw disappears.", "You spend so much on the future that today slips: the check-in you skipped, the person in front of you who needed you. Your team lives in the present, and if you are never there, they stop feeling led even while you protect them."], "training": ["Turn what you see into the next concrete step people can take now. Give them the move and the reason, not the whole map. You hold the long view, just translate it into one action at a time.", "When you make an early call, show your work. Walk people through how you got there so they learn to trust the pattern. Do it enough and they will move before they fully understand it.", "Block real time to be present this week, not just planning. Put the check-ins and one-on-ones on the calendar and protect them. How you show up is yours, but be in today too."]}, "diamond": {"name": "The Diamond Cutter", "color": "30343B", "essence": "You hold a high standard, and the work is better for going through you. The problem is the standard lives in you, which makes you the bottleneck.", "leaders": ["Gordon Ramsay", "Anna Wintour"], "partners": ["Silent Gear", "Calm Juggernaut"], "clash": ["Human Espresso", "Explosive Cricket"], "workwith": "You hold a high standard. With a Human Espresso or an Explosive Cricket, agree on what good enough looks like up front, so your standard does not become the thing that slows everyone down.", "strengths": ["You catch the mistakes other people miss.", "People trust the work when your name is on it.", "You set the standard the whole team works to."], "shadows": ["Everything routes back to you to check, so the work waits on you. Your standard has quietly made you the bottleneck the whole team is stuck behind. Keep it up and your team's speed is capped at whatever you can personally review.", "You keep improving things past the point it helps. The last ten percent takes the most time and moves the result the least. Over-polish enough and you miss deadlines chasing a difference no one else can see.", "People stop reaching for their best because they know you will fix it anyway. Without meaning to, you have trained them to hand you the rough version. The more you catch, the less they try, and the gap between your standard and theirs grows."], "training": ["Take one thing you always check and write down the three things that make it good. Hand it to someone with that list as the bar and let them own it. You are teaching your eye, not giving up the standard.", "Decide what finished looks like before the work starts, so precision serves the deadline instead of eating it. Not everything earns your top gear. You set the level, just set it on purpose.", "When someone hands you work that is good enough, leave it. Let the small imperfection stand so they learn to own the quality themselves. It will feel uncomfortable at first, and that is fine."]}};var STATEMENTS=[{"t": "When something goes wrong in my group, I take the blame myself.", "a": "lion"}, {"t": "I take on the hardest jobs so the people around me do not have to.", "a": "lion"}, {"t": "I care more about how my people are doing than about getting credit.", "a": "lion"}, {"t": "I want my team to look good, even if I do not.", "a": "lion"}, {"t": "When the room feels flat, I try to lift the energy.", "a": "espresso"}, {"t": "My mood affects the mood of the people around me.", "a": "espresso"}, {"t": "I am good at getting people excited about the work.", "a": "espresso"}, {"t": "I bring energy to the people around me, even on hard days.", "a": "espresso"}, {"t": "When other people panic, I stay calm.", "a": "juggernaut"}, {"t": "People come to me because I stay calm under pressure.", "a": "juggernaut"}, {"t": "Stressful situations do not rattle me.", "a": "juggernaut"}, {"t": "I am usually the calm, steady one in the group.", "a": "juggernaut"}, {"t": "I hold people to a high standard without being harsh.", "a": "velvet"}, {"t": "I can be kind to someone and still expect a lot from them.", "a": "velvet"}, {"t": "People take me seriously without me having to be loud.", "a": "velvet"}, {"t": "I can have a hard conversation with someone and keep the relationship good.", "a": "velvet"}, {"t": "I enjoy helping other people grow.", "a": "whisperer"}, {"t": "I push people to do more than they think they can.", "a": "whisperer"}, {"t": "I give people honest feedback, even when it is hard to hear.", "a": "whisperer"}, {"t": "I spot potential in people before they see it in themselves.", "a": "whisperer"}, {"t": "I speak well of people when they are not in the room.", "a": "kingmaker"}, {"t": "I like introducing people to others who can help them.", "a": "kingmaker"}, {"t": "I push people forward for opportunities before they ask.", "a": "kingmaker"}, {"t": "When something goes well, I give the credit to the people who did the work.", "a": "kingmaker"}, {"t": "When a problem keeps coming back, I fix the root of it.", "a": "gear"}, {"t": "I set things up so the work keeps running when I am not there.", "a": "gear"}, {"t": "I feel best when everything runs smoothly on its own.", "a": "gear"}, {"t": "I naturally think in systems and routines.", "a": "gear"}, {"t": "I am usually the one asking why we do things a certain way.", "a": "cricket"}, {"t": "When a rule does not make sense, I speak up about it.", "a": "cricket"}, {"t": "I will say what I think in a meeting even when everyone else stays quiet.", "a": "cricket"}, {"t": "I am willing to challenge how things are done.", "a": "cricket"}, {"t": "People feel safe bringing me bad news.", "a": "grizzly"}, {"t": "When someone admits a mistake, I stay calm about it.", "a": "grizzly"}, {"t": "I admit my own mistakes openly.", "a": "grizzly"}, {"t": "People tell me about problems early, before they get big.", "a": "grizzly"}, {"t": "I get things done by being steady and consistent.", "a": "turtle"}, {"t": "I keep the same pace whether things are going well or badly.", "a": "turtle"}, {"t": "I show up and do the work the same way every day.", "a": "turtle"}, {"t": "I usually keep going after other people have given up.", "a": "turtle"}, {"t": "I usually see problems coming before other people do.", "a": "lighthouse"}, {"t": "I think ahead about what might happen next.", "a": "lighthouse"}, {"t": "I deal with problems early, before they get big.", "a": "lighthouse"}, {"t": "I help the people around me avoid surprises by planning ahead.", "a": "lighthouse"}, {"t": "I notice small details that other people miss.", "a": "diamond"}, {"t": "I have a hard time leaving something unfinished or sloppy.", "a": "diamond"}, {"t": "When something has to be exactly right, people ask me to check it.", "a": "diamond"}, {"t": "I hold a high standard for quality.", "a": "diamond"}];
